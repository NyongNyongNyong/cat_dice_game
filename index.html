<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주사위 고양이</title>
  <style>
    :root {
      --bg: #1e1a24; --surface: #2a2433; --surface2: #352e42;
      --accent: #f4a261; --green: #6ecf8f; --pink: #ff8fab;
      --gold: #ffd166; --text: #f5eef8; --muted: #a89bb5;
      --die: #faf6ff; --pip: #3d3550;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; padding: 1rem 1.2rem 2rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(ellipse 70% 45% at 50% -8%, rgba(244,162,97,0.13), transparent);
      color: var(--text);
    }
    .app { max-width: 54rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.6rem; align-items: center; }
    h1 { font-size: 1.25rem; }
    .status { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; font-size: 0.88rem; color: var(--muted); }
    .status strong { color: var(--gold); }
    .panel { background: var(--surface); border-radius: 0.8rem; padding: 1rem; box-shadow: 0 6px 24px rgba(0,0,0,0.22); }
    .panel h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.6rem; }
    .hint { font-size: 0.82rem; color: var(--muted); line-height: 1.4; }

    .item-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .item-chip {
      background: var(--surface2); border-radius: 0.45rem; padding: 0.4rem 0.6rem;
      font-size: 0.75rem; border: 2px solid transparent;
    }
    .item-chip.active { border-color: var(--pink); box-shadow: 0 0 8px rgba(255,143,171,0.35); }
    .item-chip .n { font-weight: 700; color: var(--pink); display: block; font-size: 0.78rem; }
    .item-chip .d { color: var(--muted); font-size: 0.68rem; }

    .dice-pool, .roll-row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
    .die-btn { border: 2px solid transparent; background: none; cursor: pointer; padding: 0.2rem; border-radius: 0.55rem; }
    .die-btn.selected { border-color: var(--accent); }
    .die-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .die {
      --sz: 3.35rem; width: var(--sz); height: var(--sz);
      background: var(--die); border-radius: 0.55rem;
      box-shadow: 0 3px 0 #d8d0e8, 0 5px 12px rgba(0,0,0,0.2);
      display: grid; place-items: center; font-weight: 800;
      font-size: calc(var(--sz) * 0.36); color: var(--pip);
      border: 2px solid transparent; transition: 0.12s;
    }
    .sym-gold { color: #b8860a; }
    .sym-chain { color: #4a90c4; }
    .sym-copy { color: #9b59b6; }
    .sym-boom { color: #e76f51; }
    .sym-zero { color: #888; }
    .die.on { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,209,102,0.4); transform: scale(1.06); }
    .die.item-on { border-color: var(--pink); box-shadow: 0 0 12px rgba(255,143,171,0.4); }
    .die.rolling {
      animation: shake 0.45s ease-in-out;
      transition: none;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-12deg) translateY(-4px); }
      40% { transform: rotate(10deg) translateY(2px); }
      60% { transform: rotate(-8deg) translateY(-2px); }
      80% { transform: rotate(6deg) translateY(1px); }
    }

    .die-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
    .die-name { font-size: 0.58rem; color: var(--muted); text-align: center; max-width: 3.6rem; }
    .roll-slot { position: relative; min-width: 3.6rem; min-height: 4rem; display: flex; align-items: center; justify-content: center; }
    .roll-slot.empty { border: 2px dashed var(--surface2); border-radius: 0.55rem; color: var(--muted); font-size: 0.65rem; }

    .log {
      min-height: 2.6rem; padding: 0.5rem; background: var(--surface2); border-radius: 0.45rem;
      font-size: 0.85rem; color: var(--muted); text-align: center; line-height: 1.45;
    }
    .log .g { color: var(--green); font-weight: 700; }
    .log .c { color: var(--pink); font-weight: 600; }
    .log .f { color: var(--gold); font-weight: 700; }

    .actions { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; margin-top: 0.4rem; }
    button { font: inherit; font-weight: 600; font-size: 0.88rem; padding: 0.55rem 1rem; border: none; border-radius: 0.45rem; cursor: pointer; }
    button.go { background: var(--accent); color: #2a1808; }
    button.sub { background: var(--surface2); color: var(--text); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.buy { background: var(--green); color: #0f1a12; font-size: 0.74rem; padding: 0.35rem 0.55rem; width: 100%; }

    .shop-h { font-size: 0.7rem; color: var(--muted); margin: 0.45rem 0 0.3rem; width: 100%; }
    .shop-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .shop-box {
      background: var(--surface2); border-radius: 0.5rem; padding: 0.55rem 0.7rem;
      min-width: 7rem; max-width: 9rem; display: flex; flex-direction: column; gap: 0.25rem;
    }
    .shop-box .t { font-weight: 700; font-size: 0.84rem; }
    .shop-box .p { font-size: 0.72rem; color: var(--muted); line-height: 1.3; }
    .shop-box .pr { color: var(--gold); font-weight: 600; font-size: 0.78rem; }

    .pop-money {
      position: absolute; left: 50%; top: 30%; transform: translateX(-50%);
      color: var(--gold); font-weight: 800; font-size: 0.78rem;
      animation: pop 0.55s ease-out forwards; pointer-events: none; z-index: 5;
    }
    .pop-item {
      position: absolute; left: 50%; top: 0; transform: translate(-50%, -100%);
      background: rgba(42,36,51,0.94); border: 2px solid var(--pink); border-radius: 0.4rem;
      padding: 0.3rem 0.45rem; text-align: center; min-width: 5.2rem;
      animation: item-rise 0.7s ease-out forwards; pointer-events: none; z-index: 8;
    }
    .pop-item .pn { font-size: 0.6rem; font-weight: 700; color: var(--pink); display: block; }
    .pop-item .pm { font-size: 0.82rem; font-weight: 800; color: var(--green); }

    @keyframes pop { to { opacity: 0; transform: translate(-50%, -1rem); } }
    @keyframes item-rise {
      0% { opacity: 0; transform: translate(-50%, -70%) scale(0.9); }
      20% { opacity: 1; transform: translate(-50%, -105%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🐱 주사위 고양이</h1>
      <div class="status">
        <span>라운드 <strong id="round">1</strong></span>
        <span><strong id="phase">선택</strong></span>
        <span>💰 <strong id="coins">10</strong></span>
        <span>선택 <strong id="sel-n">0</strong>/5</span>
      </div>
    </header>

    <p class="hint panel" style="padding:0.55rem 0.8rem;margin:0">
      주사위로 연쇄 → <strong>효과 아이템</strong>이 해당 칸에서 점수 · 상점에서 엔진 확장
    </p>

    <section class="panel">
      <h2>효과 아이템</h2>
      <div class="item-list" id="items-owned"></div>
    </section>

    <section class="panel" id="play">
      <h2>보유 주사위 (클릭 · 최대 5)</h2>
      <div class="dice-pool" id="pool"></div>
      <h2 style="margin-top:0.75rem">굴릴 슬롯 <span style="font-weight:400;color:var(--muted)">(선택 순 = 왼→오)</span></h2>
      <div class="roll-row" id="row"></div>
      <div class="log" id="log">기본냥 3개 — 주사위를 고르세요.</div>
      <div class="actions">
        <button type="button" class="go" id="btn-roll">굴리기!</button>
        <button type="button" class="sub hidden" id="btn-shop">상점 →</button>
      </div>
    </section>

    <section class="panel hidden" id="shop">
      <h2>상점</h2>
      <div id="shop-body"></div>
      <div class="actions" style="margin-top:0.6rem">
        <button type="button" class="sub" id="btn-reroll">진열 새로고침 (2원)</button>
        <button type="button" class="go" id="btn-next">다음 라운드</button>
      </div>
    </section>
  </div>

  <script>
    const MAX_SEL = 5;
    const MAX_CHAIN = 30;
    const REROLL_COST = 2;
    const ROLL_MS = 450;
    const STEP_BASE = 580;
    const STEP_MIN = 120;
    const CHAIN_CAP = 7500;

    const DICE = {
      basic: { name: "기본냥", faces: [1,2,3,4,5,6], cost: 0, tip: "숫자만" },
      golden: { name: "황금냥", faces: [1,2,3,4,"$",6], cost: 7, tip: "$ +1원" },
      chain: { name: "연쇄냥", faces: [1,2,3,"↺",5,6], cost: 9, tip: "↺ 재굴림" },
      copy: { name: "복사냥", faces: [1,2,"★","★",5,6], cost: 11, tip: "★ 재발동" },
      gamble: { name: "도박냥", faces: [0,0,0,8,8,8], cost: 13, tip: "0 / 8" },
    };

    const ITEMS = {
      can: { name: "통조림 창고", desc: "$ → +1", cost: 4 },
      scratch: { name: "스크래쳐", desc: "재굴림 → +2", cost: 4 },
      tower: { name: "캣타워", desc: "같은숫자×2+ → +3", cost: 5 },
      fish: { name: "생선 바구니", desc: "짝수 → +1", cost: 3 },
      overload: { name: "과부하 쿠션", desc: "8 → +5", cost: 6 },
    };

    const SHOP_DICE = ["golden", "chain", "copy", "gamble"];
    const SHOP_ITEMS = Object.keys(ITEMS);

    let uid = 1;

    const S = {
      round: 1,
      phase: "select",
      coins: 10,
      dice: [],
      items: [],
      selected: [],
      board: [],
      busy: false,
      shopPool: [],
    };

    const $ = (id) => document.getElementById(id);

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const lbl = (f) => String(f);
    const dieType = (id) => DICE[id];
    const getDie = (u) => S.dice.find((d) => d.uid === u);
    const countItem = (id) => S.items.filter((x) => x === id).length;
    const hasItem = (id) => countItem(id) > 0;

    function stepMs(n, i) {
      return Math.max(STEP_MIN, Math.min(STEP_BASE, CHAIN_CAP / Math.max(1, n)) * Math.pow(0.93, i));
    }

    function faceCls(f) {
      if (f === "$") return "sym-gold";
      if (f === "↺") return "sym-chain";
      if (f === "★") return "sym-copy";
      if (f === 8) return "sym-boom";
      if (f === 0) return "sym-zero";
      return "";
    }

    function paintDie(el, f, cls = "") {
      el.textContent = lbl(f);
      el.className = "die " + faceCls(f) + (cls ? " " + cls : "");
    }

    function addDie(typeId) {
      S.dice.push({ uid: uid++, typeId });
    }

    function rollFace(typeId) {
      const faces = dieType(typeId).faces;
      return faces[Math.floor(Math.random() * faces.length)];
    }

    function renderItems() {
      const el = $("items-owned");
      if (!S.items.length) {
        el.innerHTML = '<span class="hint">없음 — 상점에서 구매</span>';
        return;
      }
      const counts = {};
      for (const id of S.items) counts[id] = (counts[id] || 0) + 1;
      el.innerHTML = Object.entries(counts)
        .map(([id, n]) => {
          const it = ITEMS[id];
          const stack = n > 1 ? ` ×${n}` : "";
          return `<div class="item-chip" data-id="${id}"><span class="n">${it.name}${stack}</span><span class="d">${it.desc}</span></div>`;
        })
        .join("");
    }

    function flashItem(id) {
      document.querySelectorAll(`.item-chip[data-id="${id}"]`).forEach((el) => {
        el.classList.add("active");
        setTimeout(() => el.classList.remove("active"), 500);
      });
    }

    function renderPool() {
      $("pool").innerHTML = "";
      for (const d of S.dice) {
        const t = dieType(d.typeId);
        const b = document.createElement("button");
        b.type = "button";
        b.className = "die-btn" + (S.selected.includes(d.uid) ? " selected" : "");
        b.disabled = S.busy || S.phase !== "select";
        b.innerHTML = `<div class="die-wrap"><div class="die" style="font-size:0.75rem">${t.name.slice(0,2)}</div><span class="die-name">${t.name}</span></div>`;
        b.onclick = () => toggleSel(d.uid);
        $("pool").appendChild(b);
      }
    }

    function renderRow(hi = -1, itemHi = -1) {
      $("row").innerHTML = "";
      for (let i = 0; i < MAX_SEL; i++) {
        const slot = document.createElement("div");
        slot.className = "roll-slot";
        slot.dataset.slot = i;
        if (i < S.selected.length) {
          const d = getDie(S.selected[i]);
          const t = dieType(d.typeId);
          const wrap = document.createElement("div");
          wrap.className = "die-wrap";
          const face = document.createElement("div");
          face.id = `f-${i}`;
          let cls = hi === i ? "on" : "";
          if (itemHi === i) cls += " item-on";
          if (S.board[i] !== undefined) paintDie(face, S.board[i], cls.trim());
          else {
            face.className = "die" + (cls ? " " + cls : "");
            face.textContent = "?";
          }
          const nm = document.createElement("span");
          nm.className = "die-name";
          nm.textContent = t.name;
          wrap.append(face, nm);
          slot.appendChild(wrap);
        } else {
          slot.classList.add("empty");
          slot.textContent = "—";
        }
        $("row").appendChild(slot);
      }
    }

    function toggleSel(u) {
      if (S.phase !== "select" || S.busy) return;
      const i = S.selected.indexOf(u);
      if (i >= 0) S.selected.splice(i, 1);
      else if (S.selected.length < MAX_SEL) S.selected.push(u);
      $("sel-n").textContent = S.selected.length;
      renderPool();
      renderRow();
      $("btn-roll").disabled = !S.selected.length;
    }

    function popMoney(slot, text) {
      const s = $("row").querySelector(`[data-slot="${slot}"]`);
      if (!s) return;
      const p = document.createElement("span");
      p.className = "pop-money";
      p.textContent = text;
      s.appendChild(p);
      setTimeout(() => p.remove(), 550);
    }

    function popItem(slot, name, money) {
      const s = $("row").querySelector(`[data-slot="${slot}"]`);
      if (!s) return;
      const p = document.createElement("div");
      p.className = "pop-item";
      p.innerHTML = `<span class="pn">${name}</span><span class="pm">+${money}원</span>`;
      s.appendChild(p);
      setTimeout(() => p.remove(), 720);
    }

    function addCoins(n) {
      S.coins += n;
      $("coins").textContent = S.coins;
    }

    /** @typedef {{ slot: number, dieUid: number, face: number|string }} Ev */

    function mkCtx() {
      return {
        dollarSlots: [],
        rerollSlots: [],
        eightSlots: [],
        diceMoney: 0,
        resolved: [],
      };
    }

    /** @param {Ev} ev @param {Ev[]} q @param ctx */
    function resolve(ev, q, ctx) {
      const f = ev.face;
      let money = 0;
      let log = "";
      ctx.resolved.push(f);

      if (f === "$") {
        money = 1;
        ctx.dollarSlots.push({ slot: ev.slot });
        log = "$ +1원";
      } else if (f === "↺") {
        const others = S.selected.map((_, i) => i).filter((i) => i !== ev.slot);
        if (others.length) {
          const pick = others[Math.floor(Math.random() * others.length)];
          const dieUid = S.selected[pick];
          const face = rollFace(getDie(dieUid).typeId);
          S.board[pick] = face;
          ctx.rerollSlots.push({ slot: pick });
          q.push({ slot: pick, dieUid, face });
          log = `↺ → ${pick + 1}번 [${lbl(face)}]`;
        } else log = "↺ (대상 없음)";
      } else if (f === "★") {
        const pool = [];
        S.board.forEach((face, idx) => {
          if (idx !== ev.slot && face !== "★") pool.push({ slot: ev.slot, dieUid: ev.dieUid, face });
        });
        ctx.resolved.forEach((face) => {
          if (face !== "★") pool.push({ slot: ev.slot, dieUid: ev.dieUid, face });
        });
        if (pool.length) {
          const pick = pool[Math.floor(Math.random() * pool.length)];
          q.unshift({ ...pick });
          log = `★ → [${lbl(pick.face)}] 재발동`;
        } else log = "★ (없음)";
      } else if (f === 8) {
        ctx.eightSlots.push({ slot: ev.slot });
        log = "8 (폭발 판정)";
      } else if (f === 0) {
        log = "0 꽝";
      } else if (typeof f === "number") {
        log = `${f} (아이템 채점)`;
      } else {
        log = lbl(f);
      }

      ctx.diceMoney += money;
      return { money, log };
    }

    async function runChain(faces) {
      S.board = [...faces];
      renderRow();
      const q = S.selected.map((uid, slot) => ({ slot, dieUid: uid, face: faces[slot] }));
      const ctx = mkCtx();
      let step = 0;

      await sleep(320);

      while (q.length && step < MAX_CHAIN) {
        const ev = q.shift();
        step++;
        renderRow(ev.slot);
        const el = $(`f-${ev.slot}`);
        if (el) paintDie(el, ev.face, "on");

        const die = getDie(ev.dieUid);
        const { money, log } = resolve(ev, q, ctx);
        if (money) {
          addCoins(money);
          popMoney(ev.slot, `+${money}`);
        }

        $("log").innerHTML = `<span class="f">[${lbl(ev.face)}]</span> ${dieType(die.typeId).name}<br>${log} <span style="color:var(--muted)">(${step})</span>`;
        await sleep(stepMs(step + q.length, step));
      }

      renderRow();
      return ctx;
    }

    /** @typedef {{ id: string, name: string, slot: number, money: number }} ItemEv */

    function buildItemEvents(ctx) {
      /** @type {ItemEv[]} */
      const out = [];
      const nCan = countItem("can");
      const nScratch = countItem("scratch");
      const nFish = countItem("fish");
      const nTower = countItem("tower");
      const nOverload = countItem("overload");

      if (nCan) {
        for (const { slot } of ctx.dollarSlots) {
          for (let i = 0; i < nCan; i++) {
            out.push({ id: "can", name: ITEMS.can.name, slot, money: 1 });
          }
        }
      }
      if (nScratch) {
        for (const { slot } of ctx.rerollSlots) {
          for (let i = 0; i < nScratch; i++) {
            out.push({ id: "scratch", name: ITEMS.scratch.name, slot, money: 2 });
          }
        }
      }
      if (nFish) {
        S.board.forEach((f, slot) => {
          if (typeof f === "number" && f > 0 && f % 2 === 0) {
            for (let i = 0; i < nFish; i++) {
              out.push({ id: "fish", name: ITEMS.fish.name, slot, money: 1 });
            }
          }
        });
      }
      if (nTower) {
        const groups = {};
        S.board.forEach((f, slot) => {
          if (typeof f !== "number" || f <= 0) return;
          (groups[f] ||= []).push(slot);
        });
        for (const slots of Object.values(groups)) {
          if (slots.length >= 2) {
            for (let i = 0; i < nTower; i++) {
              out.push({ id: "tower", name: ITEMS.tower.name, slot: slots[0], money: 3 });
            }
            break;
          }
        }
      }
      if (nOverload) {
        for (const { slot } of ctx.eightSlots) {
          for (let i = 0; i < nOverload; i++) {
            out.push({ id: "overload", name: ITEMS.overload.name, slot, money: 5 });
          }
        }
      }

      return out;
    }

    async function runItems(ctx) {
      const events = buildItemEvents(ctx);
      if (!events.length) return 0;

      $("log").innerHTML += `<br><span class="c">— 효과 아이템 —</span>`;
      await sleep(300);

      let sum = 0;
      for (let i = 0; i < events.length; i++) {
        const e = events[i];
        sum += e.money;
        addCoins(e.money);
        flashItem(e.id);
        renderRow(-1, e.slot);
        popItem(e.slot, e.name, e.money);
        $("log").innerHTML = `<span class="c">${e.name}</span> · ${e.slot + 1}번 주사위<br><span class="g">+${e.money}원</span> (${i + 1}/${events.length})`;
        await sleep(stepMs(events.length, i));
      }
      renderRow();
      return sum;
    }

    async function doRoll() {
      if (S.busy || !S.selected.length) return;
      S.busy = true;
      $("btn-roll").disabled = true;
      $("log").textContent = "굴리는 중…";

      const rolling = $("row").querySelectorAll(".die");
      rolling.forEach((d) => {
        d.classList.remove("rolling");
        void d.offsetWidth;
        d.classList.add("rolling");
      });
      await sleep(ROLL_MS);
      rolling.forEach((d) => d.classList.remove("rolling"));

      const faces = S.selected.map((u) => rollFace(getDie(u).typeId));
      S.board = faces;
      renderRow();
      faces.forEach((f, i) => {
        const el = $(`f-${i}`);
        if (el) paintDie(el, f);
      });

      await sleep(260);
      const ctx = await runChain(faces);
      const itemMoney = await runItems(ctx);
      const total = ctx.diceMoney + itemMoney;

      $("log").innerHTML += `<br><span class="g">이번 굴림 +${total}원</span> (주사위 ${ctx.diceMoney} + 아이템 ${itemMoney})`;

      S.busy = false;
      S.phase = "done";
      $("phase").textContent = "완료";
      $("btn-shop").classList.remove("hidden");
      renderPool();
    }

    function pickShopPool() {
      const pool = [];
      for (const id of SHOP_DICE) pool.push({ kind: "dice", id, ...dieType(id), cost: dieType(id).cost });
      for (const id of SHOP_ITEMS) {
        if (Math.random() < 0.55) pool.push({ kind: "item", id, ...ITEMS[id], cost: ITEMS[id].cost });
      }
      S.shopPool = [];
      const n = 5 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n && pool.length; i++) {
        const j = Math.floor(Math.random() * pool.length);
        S.shopPool.push(pool.splice(j, 1)[0]);
      }
    }

    function renderShop() {
      $("shop-body").innerHTML = "";
      if (!S.shopPool.length) pickShopPool();

      const h = document.createElement("p");
      h.className = "shop-h";
      h.textContent = "진열";
      $("shop-body").appendChild(h);

      const grid = document.createElement("div");
      grid.className = "shop-grid";

      for (const o of S.shopPool) {
        const box = document.createElement("div");
        box.className = "shop-box";
        const faces = o.faces ? o.faces.map(lbl).join(" ") : "";
        const can = S.coins >= o.cost;
        box.innerHTML = `
          <div class="t">${o.name}</div>
          <div class="p">${o.desc || o.tip || ""}</div>
          ${faces ? `<div class="p">${faces}</div>` : ""}
          <div class="pr">${o.cost}원</div>
          <button type="button" class="buy" ${can ? "" : "disabled"}>구매</button>
        `;
        if (can) {
          box.querySelector(".buy").onclick = () => {
            if (S.coins < o.cost) return;
            S.coins -= o.cost;
            $("coins").textContent = S.coins;
            if (o.kind === "dice") addDie(o.id);
            else S.items.push(o.id);
            renderItems();
            renderPool();
            renderShop();
          };
        }
        grid.appendChild(box);
      }
      $("shop-body").appendChild(grid);
    }

    function openShop() {
      S.phase = "shop";
      $("phase").textContent = "상점";
      $("play").classList.add("hidden");
      $("shop").classList.remove("hidden");
      pickShopPool();
      renderShop();
    }

    function nextRound() {
      S.round++;
      S.phase = "select";
      S.selected = [];
      S.board = [];
      $("round").textContent = S.round;
      $("phase").textContent = "선택";
      $("sel-n").textContent = "0";
      $("btn-shop").classList.add("hidden");
      $("shop").classList.add("hidden");
      $("play").classList.remove("hidden");
      $("log").textContent = "주사위를 고르세요.";
      $("btn-roll").disabled = true;
      renderPool();
      renderRow();
    }

    function init() {
      addDie("basic");
      addDie("basic");
      addDie("basic");
      renderItems();
      renderPool();
      renderRow();
    }

    $("btn-roll").onclick = doRoll;
    $("btn-shop").onclick = openShop;
    $("btn-next").onclick = nextRound;
    $("btn-reroll").onclick = () => {
      if (S.coins < REROLL_COST) return;
      S.coins -= REROLL_COST;
      $("coins").textContent = S.coins;
      pickShopPool();
      renderShop();
    };

    init();
  </script>
</body>
</html>
