<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캣타워 다이스</title>
  <style>
    :root {
      --bg: #1a1620; --surface: #262030; --surface2: #322a3d;
      --accent: #f4a261; --green: #6ecf8f; --pink: #ff8fab;
      --gold: #ffd166; --text: #f5eef8; --muted: #a89bb5;
      --die: #faf6ff; --tower: #3d3550;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; padding: 1rem 1.2rem 2rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(244,162,97,0.12), transparent);
      color: var(--text);
    }
    .app { max-width: 58rem; margin: 0 auto; display: flex; flex-direction: column; gap: 0.9rem; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; align-items: center; }
    h1 { font-size: 1.2rem; }
    .status { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.85rem; color: var(--muted); }
    .status strong { color: var(--gold); }
    .panel { background: var(--surface); border-radius: 0.75rem; padding: 0.9rem 1rem; box-shadow: 0 6px 22px rgba(0,0,0,0.2); }
    .panel h2 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.5rem; }
    .hint { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }

    .main-grid { display: grid; grid-template-columns: 1fr minmax(12rem, 16rem) 1fr; gap: 0.75rem; align-items: start; }
    @media (max-width: 720px) { .main-grid { grid-template-columns: 1fr; } }

    .roster { display: flex; flex-direction: column; gap: 0.45rem; min-height: 8rem; }
    .roster.empty-hint { justify-content: center; color: var(--muted); font-size: 0.78rem; text-align: center; }

    .cat-card {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.55rem;
      background: var(--surface2); border-radius: 0.5rem; border: 2px solid transparent;
      cursor: pointer; transition: 0.12s;
    }
    .cat-card:hover { border-color: rgba(244,162,97,0.35); }
    .cat-card.picked { border-color: var(--accent); box-shadow: 0 0 10px rgba(244,162,97,0.25); }
    .cat-card .ico { font-size: 1.4rem; line-height: 1; }
    .cat-card .info { flex: 1; min-width: 0; }
    .cat-card .n { font-weight: 700; font-size: 0.82rem; }
    .cat-card .d { font-size: 0.65rem; color: var(--muted); line-height: 1.3; }

    .tower { display: flex; flex-direction: column-reverse; gap: 0.4rem; }
    .floor {
      display: grid; grid-template-columns: 2.2rem 1fr auto;
      align-items: center; gap: 0.5rem; padding: 0.45rem 0.55rem;
      background: var(--surface2); border-radius: 0.55rem;
      border: 2px solid var(--tower); min-height: 3.6rem;
      position: relative; transition: 0.12s;
    }
    .floor.drop-target { border-color: var(--accent); background: rgba(244,162,97,0.08); }
    .floor.active { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,209,102,0.25); }
    .floor .flabel { font-size: 0.7rem; font-weight: 700; color: var(--muted); text-align: center; }
    .floor .flabel span { display: block; font-size: 0.58rem; color: var(--gold); }
    .floor .slot {
      display: flex; align-items: center; justify-content: center; min-height: 2.8rem;
      border: 2px dashed rgba(168,155,181,0.35); border-radius: 0.45rem;
      color: var(--muted); font-size: 0.72rem; cursor: pointer;
    }
    .floor .slot.has-cat { border-style: solid; border-color: transparent; }

    .die {
      --sz: 2.9rem; width: var(--sz); height: var(--sz);
      background: var(--die); border-radius: 0.5rem;
      box-shadow: 0 3px 0 #d8d0e8, 0 4px 10px rgba(0,0,0,0.18);
      display: grid; place-items: center; font-weight: 800;
      color: #3d3550; border: 2px solid transparent;
    }
    .die .pip { font-size: 1.55rem; line-height: 1; }
    .die .ico-sm { font-size: 1.1rem; line-height: 1; }
    .die.rolling { animation: shake 0.45s ease-in-out; transition: none; }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-12deg) translateY(-4px); }
      40% { transform: rotate(10deg) translateY(2px); }
      60% { transform: rotate(-8deg) translateY(-2px); }
      80% { transform: rotate(6deg) translateY(1px); }
    }
    .die.on { border-color: var(--gold); transform: scale(1.05); }
    .die.neg { color: #c44; }

    .mult-tag { font-size: 0.65rem; color: var(--gold); font-weight: 700; white-space: nowrap; }

    .log {
      min-height: 10rem; max-height: 14rem; overflow-y: auto;
      padding: 0.5rem; background: var(--surface2); border-radius: 0.45rem;
      font-size: 0.78rem; color: var(--muted); line-height: 1.5;
    }
    .log .g { color: var(--green); font-weight: 700; }
    .log .f { color: var(--gold); font-weight: 600; }
    .log .c { color: var(--pink); }
    .log .bad { color: #e76f51; }

    .pop-score {
      position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%);
      color: var(--green); font-weight: 800; font-size: 0.75rem;
      animation: pop 0.55s ease-out forwards; pointer-events: none;
    }
    @keyframes pop { to { opacity: 0; transform: translateY(-70%); } }

    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
    button {
      font: inherit; font-weight: 600; font-size: 0.86rem;
      padding: 0.5rem 0.95rem; border: none; border-radius: 0.45rem; cursor: pointer;
    }
    button.go { background: var(--accent); color: #2a1808; }
    button.sub { background: var(--surface2); color: var(--text); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.buy { background: var(--green); color: #0f1a12; font-size: 0.72rem; padding: 0.35rem 0.5rem; width: 100%; }

    .shop-grid { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .shop-box {
      background: var(--surface2); border-radius: 0.45rem; padding: 0.5rem 0.65rem;
      min-width: 6.5rem; max-width: 8.5rem; display: flex; flex-direction: column; gap: 0.2rem;
    }
    .shop-box .t { font-weight: 700; font-size: 0.8rem; }
    .shop-box .p { font-size: 0.68rem; color: var(--muted); line-height: 1.3; }
    .shop-box .pr { color: var(--gold); font-size: 0.75rem; font-weight: 600; }

    .hidden { display: none !important; }
    .banner { text-align: center; padding: 0.6rem; border-radius: 0.5rem; font-weight: 700; }
    .banner.win { background: rgba(110,207,143,0.15); color: var(--green); }
    .banner.lose { background: rgba(231,111,81,0.15); color: #e76f51; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🐱 캣타워 다이스</h1>
      <div class="status">
        <span>라운드 <strong id="round">1</strong></span>
        <span>목표 <strong id="target">25</strong>점</span>
        <span>이번 점수 <strong id="round-score">0</strong></span>
        <span>총점 <strong id="total-score">0</strong></span>
        <span>골드 <strong id="gold">15</strong>G</span>
        <span id="phase-label">세팅</span>
      </div>
    </header>

    <p class="hint panel" style="padding:0.65rem 0.9rem">
      고양이마다 <strong>1~6 주사위</strong> 눈이 다릅니다. 층에 배치 → <strong>한 번에 굴리기</strong> → 나온 <strong>숫자</strong>로 점수·시너지가 터집니다.
    </p>

    <div class="main-grid">
      <section class="panel">
        <h2>보유 고양이</h2>
        <div class="roster" id="roster"></div>
      </section>

      <section class="panel">
        <h2>캣타워</h2>
        <div class="tower" id="tower"></div>
        <div class="actions" style="margin-top:0.6rem">
          <button type="button" class="go" id="btn-roll">한 번에 굴리기!</button>
          <button type="button" class="sub hidden" id="btn-shop">상점</button>
          <button type="button" class="sub hidden" id="btn-next">다음 라운드</button>
        </div>
      </section>

      <section class="panel">
        <h2>연출 로그</h2>
        <div class="log" id="log">고양이를 층에 배치하세요.</div>
      </section>
    </div>

    <section class="panel hidden" id="shop-panel">
      <h2>상점</h2>
      <div class="shop-grid" id="shop"></div>
      <div class="actions" style="margin-top:0.5rem">
        <button type="button" class="sub" id="btn-reroll">진열 새로고침 (3G)</button>
      </div>
    </section>

    <div class="banner hidden" id="banner"></div>
  </div>

  <script>
    const FLOOR_MULT = [0, 1, 1.2, 1.5, 2, 3];
    const ROUND_TARGETS = [25, 45, 70, 100, 140, 200];
    const ROLL_MS = 450;
    const STEP_MS = 520;

  /** 고양이마다 나올 1~6 눈 가중치 (주사위 = 숫자) */
    const CATS = {
      sleep: {
        id: "sleep", name: "잠냥", ico: "😴",
        faces: [1, 2, 2, 3, 3, 3],
        desc: "낮은 눈 많음 · 1~2층에서 4+ 나오면 +1",
      },
      jump: {
        id: "jump", name: "점프냥", ico: "🐇",
        faces: [2, 2, 5, 5, 5, 5],
        desc: "5 많음 · 5 나오면 바로 윗층 점수 일부 복사",
      },
      nip: {
        id: "nip", name: "캣닢냥", ico: "🌿",
        faces: [1, 2, 3, 4, 5, 6],
        desc: "모든 눈 균등 · 굴린 뒤 한 층 재굴림",
      },
      loaf: {
        id: "loaf", name: "식빵냥", ico: "🍞",
        faces: [4, 4, 4, 4, 4, 4],
        desc: "항상 4 · 타워에 있으면 다른 고양이 눈 +1",
      },
      greedy: {
        id: "greedy", name: "욕심냥", ico: "💎",
        faces: [1, 1, 2, 2, 6, 6],
        desc: "1·2 꽝 / 6 대박 · 5층에서 극단값 2배",
      },
    };

    const SHOP_CATS = ["jump", "greedy"];
    const SHOP_REROLL = 3;

    let uid = 1;
    const S = {
      phase: "setup",
      round: 1,
      totalScore: 0,
      roundScore: 0,
      gold: 15,
      cats: [],
      tower: [null, null, null, null, null],
      floorBonus: [0, 0, 0, 0, 0],
      pickUid: null,
      busy: false,
      shopOffers: [],
      lastResults: [],
    };

    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const catType = (id) => CATS[id];
    const getCat = (u) => S.cats.find((c) => c.uid === u);
    const targetForRound = () => ROUND_TARGETS[Math.min(S.round - 1, ROUND_TARGETS.length - 1)];

    function addCat(typeId) {
      S.cats.push({ uid: uid++, typeId });
    }

    function rollN(typeId) {
      const f = catType(typeId).faces;
      return f[Math.floor(Math.random() * f.length)];
    }

    function paintDieNum(el, n, extraCls = "") {
      el.className = "die" + (extraCls ? " " + extraCls : "");
      el.innerHTML = `<span class="pip">${n}</span>`;
    }

    function floorMult(floor) {
      return FLOOR_MULT[floor] + (S.floorBonus[floor - 1] || 0);
    }

    function initGame() {
      S.cats = [];
      S.tower = [null, null, null, null, null];
      S.floorBonus = [0, 0, 0, 0, 0];
      S.round = 1;
      S.totalScore = 0;
      S.roundScore = 0;
      S.gold = 15;
      S.phase = "setup";
      addCat("sleep");
      addCat("loaf");
      addCat("nip");
      renderAll();
      logMsg("런 시작! 잠냥·식빵냥·캣닢냥을 층에 배치하세요.");
    }

    function logMsg(html) {
      $("log").innerHTML = html;
    }

    function appendLog(html) {
      $("log").innerHTML += `<br>${html}`;
      $("log").scrollTop = $("log").scrollHeight;
    }

    function renderStatus() {
      $("round").textContent = S.round;
      $("target").textContent = targetForRound();
      $("round-score").textContent = S.roundScore;
      $("total-score").textContent = S.totalScore;
      $("gold").textContent = S.gold;
      const labels = { setup: "세팅", rolling: "굴림", shop: "상점", over: "종료" };
      $("phase-label").textContent = labels[S.phase] || S.phase;
    }

    function renderRoster() {
      const el = $("roster");
      const bench = S.cats.filter((c) => !S.tower.includes(c.uid));
      if (!bench.length) {
        el.className = "roster empty-hint";
        el.textContent = "모두 타워에 배치됨";
        return;
      }
      el.className = "roster";
      el.innerHTML = "";
      for (const c of bench) {
        const t = catType(c.typeId);
        const card = document.createElement("div");
        card.className = "cat-card" + (S.pickUid === c.uid ? " picked" : "");
        const faces = t.faces.join(" ");
        card.innerHTML = `<span class="ico">${t.ico}</span><div class="info"><div class="n">${t.name}</div><div class="d">${t.desc}</div><div class="d">🎲 ${faces}</div></div>`;
        card.onclick = () => {
          if (S.phase !== "setup" || S.busy) return;
          S.pickUid = S.pickUid === c.uid ? null : c.uid;
          renderRoster();
          renderTower();
        };
        el.appendChild(card);
      }
    }

    function renderTower(highlightFloor = -1) {
      $("tower").innerHTML = "";
      for (let f = 5; f >= 1; f--) {
        const row = document.createElement("div");
        row.className = "floor";
        row.dataset.floor = f;
        if (highlightFloor === f) row.classList.add("active");
        if (S.pickUid && S.phase === "setup") row.classList.add("drop-target");

        const uidOn = S.tower[f - 1];
        const mult = floorMult(f).toFixed(1);

        const label = document.createElement("div");
        label.className = "flabel";
        label.innerHTML = `${f}층<span>×${mult}</span>`;

        const slot = document.createElement("div");
        slot.className = "slot" + (uidOn ? " has-cat" : "");

        if (uidOn) {
          const c = getCat(uidOn);
          const t = catType(c.typeId);
          const die = document.createElement("div");
          die.className = "die";
          die.dataset.uid = uidOn;
          const res = S.lastResults.find((r) => r.floor === f);
          if (res) {
            paintDieNum(die, res.n, "on" + (res.total < 0 ? " neg" : ""));
          } else {
            die.className = "die";
            die.innerHTML = `<span class="ico-sm">${t.ico}</span>`;
          }
          slot.appendChild(die);
        } else {
          slot.textContent = S.pickUid ? "배치" : "비움";
        }

        slot.onclick = () => onFloorClick(f);

        const tag = document.createElement("div");
        tag.className = "mult-tag";
        tag.id = `mult-${f}`;
        const res = S.lastResults.find((r) => r.floor === f);
        if (res) tag.textContent = (res.total >= 0 ? "+" : "") + res.total;

        row.append(label, slot, tag);
        $("tower").appendChild(row);
      }
    }

    function onFloorClick(floor) {
      if (S.busy) return;
      const idx = floor - 1;
      if (S.phase === "setup") {
        if (S.pickUid) {
          if (S.tower[idx]) {
            const old = S.tower[idx];
            S.tower[idx] = S.pickUid;
            S.pickUid = old;
          } else {
            S.tower[idx] = S.pickUid;
            S.pickUid = null;
          }
        } else if (S.tower[idx]) {
          S.pickUid = S.tower[idx];
          S.tower[idx] = null;
        }
        renderRoster();
        renderTower();
        return;
      }
    }

    function placedCount() {
      return S.tower.filter(Boolean).length;
    }

    function scoreRoll(n, floor, typeId, ctx) {
      let base = n;
      const notes = [];
      const mult = floorMult(floor);

      if (ctx.loafOnTower && typeId !== "loaf") {
        base += 1;
        notes.push("식빵냥 +1");
      }

      if (typeId === "sleep" && floor <= 2 && n >= 4) {
        base += 1;
        notes.push("아래층 고눈 +1");
      }

      if (typeId === "greedy") {
        if (n === 6) {
          base = 10;
          notes.push("대박");
        } else if (n <= 2) {
          base = -3;
          notes.push("꽝");
        }
        if (floor === 5 && (n === 6 || n <= 2)) {
          base *= 2;
          notes.push("5층 ×2");
        }
      }

      const total = Math.round(base * mult);
      return { base, mult, total, notes, n };
    }

    function buildResults(rolls) {
      const ctx = { loafOnTower: S.tower.some((u) => u && getCat(u).typeId === "loaf") };
      const results = [];

      for (const { floor, uid, n } of rolls) {
        const c = getCat(uid);
        let r = scoreRoll(n, floor, c.typeId, ctx);

        if (c.typeId === "jump" && n >= 5 && floor < 5) {
          const above = results.find((x) => x.floor === floor + 1);
          if (above) {
            const bonus = Math.round(above.total * 0.5);
            r.total += bonus;
            r.notes.push(`점프(5+) +${bonus}`);
          }
        }

        results.push({ floor, uid, typeId: c.typeId, name: catType(c.typeId).name, n, ...r });
      }

      for (let f = 1; f < 5; f++) {
        const low = results.find((r) => r.floor === f);
        const high = results.find((r) => r.floor === f + 1);
        if (!low || !high) continue;

        if (low.n === high.n) {
          const bonus = Math.round((low.total + high.total) * 0.2);
          low.total += bonus;
          high.total += bonus;
          low.notes.push(`더블 ${low.n} +${bonus}`);
          high.notes.push(`더블 ${high.n} +${bonus}`);
        }

        const sum = low.n + high.n;
        if (sum >= 10) {
          const bonus = 8;
          low.total += bonus;
          high.total += bonus;
          low.notes.push(`합${sum} +${bonus}`);
          high.notes.push(`합${sum} +${bonus}`);
        }

        if (Math.abs(low.n - high.n) === 1) {
          const bonus = 5;
          low.total += bonus;
          high.total += bonus;
          low.notes.push(`연번 +${bonus}`);
          high.notes.push(`연번 +${bonus}`);
        }
      }

      return results;
    }

    async function doRoll() {
      if (S.busy || S.phase !== "setup") return;
      if (!placedCount()) {
        logMsg("최소 1마리는 층에 배치하세요.");
        return;
      }

      S.busy = true;
      S.lastResults = [];
      S.roundScore = 0;
      $("btn-roll").disabled = true;
      S.phase = "rolling";
      renderStatus();
      logMsg("굴리는 중…");

      const floors = [];
      for (let f = 1; f <= 5; f++) {
        const u = S.tower[f - 1];
        if (u) floors.push({ floor: f, uid: u });
      }

      const diceEls = $("tower").querySelectorAll(".die");
      diceEls.forEach((d) => {
        d.classList.remove("rolling");
        void d.offsetWidth;
        d.classList.add("rolling");
        d.className = "die rolling";
        d.innerHTML = `<span class="pip">?</span>`;
      });
      await sleep(ROLL_MS);
      diceEls.forEach((d) => d.classList.remove("rolling"));

      const rolls = floors.map(({ floor, uid }) => ({
        floor,
        uid,
        n: rollN(getCat(uid).typeId),
      }));

      let results = buildResults(rolls);

      if (S.tower.some((u) => u && getCat(u).typeId === "nip")) {
        if (rolls.length > 1) {
          const pick = rolls[Math.floor(Math.random() * rolls.length)];
          pick.n = rollN(getCat(pick.uid).typeId);
          appendLog(`<span class="c">캣닢냥</span> · ${pick.floor}층 재굴림 → <span class="f">🎲 ${pick.n}</span>`);
          results = buildResults(rolls);
        }
      }

      S.lastResults = results;
      renderTower();

      let sum = 0;
      for (let i = 0; i < results.length; i++) {
        const r = results[i];
        renderTower(r.floor);

        const noteStr = r.notes.length ? ` <span style="color:var(--muted)">(${r.notes.join(", ")})</span>` : "";
        appendLog(
          `<span class="f">${r.floor}층 ${r.name}</span> 🎲 <strong>${r.n}</strong> → <span class="g">${r.total >= 0 ? "+" : ""}${r.total}점</span>${noteStr}`
        );
        sum += r.total;
        await sleep(STEP_MS);
      }

      S.roundScore = sum;
      S.totalScore += sum;
      S.gold += Math.max(0, Math.floor(sum / 4));

      const tgt = targetForRound();
      appendLog(`<br>이번 라운드 <span class="g">${sum}</span>점 (목표 ${tgt}) · 골드 +${Math.max(0, Math.floor(sum / 4))}`);

      renderStatus();
      renderTower();

      if (sum < tgt) {
        S.phase = "over";
        $("banner").className = "banner lose";
        $("banner").textContent = `런 종료 — 목표 ${tgt}점 미달 (${sum}점)`;
        $("banner").classList.remove("hidden");
        $("btn-roll").disabled = true;
        S.busy = false;
        return;
      }

      S.phase = "shop";
      $("btn-shop").classList.remove("hidden");
      $("btn-next").classList.remove("hidden");
      pickShop();
      logMsg(`목표 달성! 상점으로 이동하세요. (${sum}/${tgt})`);
      S.busy = false;
    }

    function pickShop() {
      S.shopOffers = [];
      const avail = SHOP_CATS.filter((id) => !S.cats.some((c) => c.typeId === id));
      if (avail.length) {
        const id = avail[Math.floor(Math.random() * avail.length)];
        S.shopOffers.push({ kind: "cat", id, cost: id === "greedy" ? 15 : 12 });
      }
      const f = 1 + Math.floor(Math.random() * 5);
      S.shopOffers.push({ kind: "floor", floor: f, cost: 8 });
      renderShop();
    }

    function renderShop() {
      $("shop-panel").classList.remove("hidden");
      $("shop").innerHTML = "";
      for (const o of S.shopOffers) {
        const box = document.createElement("div");
        box.className = "shop-box";
        if (o.kind === "cat") {
          const t = catType(o.id);
          box.innerHTML = `<div class="t">${t.ico} ${t.name}</div><div class="p">${t.desc}</div><div class="pr">${o.cost}G</div>`;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "buy";
          btn.textContent = "구매";
          btn.disabled = S.gold < o.cost;
          btn.onclick = () => buyOffer(o);
          box.appendChild(btn);
        } else {
          box.innerHTML = `<div class="t">${o.floor}층 강화</div><div class="p">배수 +0.2</div><div class="pr">${o.cost}G</div>`;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "buy";
          btn.textContent = "구매";
          btn.disabled = S.gold < o.cost;
          btn.onclick = () => buyOffer(o);
          box.appendChild(btn);
        }
        $("shop").appendChild(box);
      }
    }

    function buyOffer(o) {
      if (S.gold < o.cost) return;
      S.gold -= o.cost;
      if (o.kind === "cat") addCat(o.id);
      else S.floorBonus[o.floor - 1] += 0.2;
      S.shopOffers = S.shopOffers.filter((x) => x !== o);
      renderShop();
      renderRoster();
      renderStatus();
    }

    function nextRound() {
      S.round++;
      S.roundScore = 0;
      S.lastResults = [];
      S.phase = "setup";
      S.pickUid = null;
      $("shop-panel").classList.add("hidden");
      $("btn-shop").classList.add("hidden");
      $("btn-next").classList.add("hidden");
      $("btn-roll").disabled = false;
      if (S.round > ROUND_TARGETS.length) {
        S.phase = "over";
        $("banner").className = "banner win";
        $("banner").textContent = `런 클리어! 총점 ${S.totalScore}`;
        $("banner").classList.remove("hidden");
        return;
      }
      renderAll();
      logMsg(`라운드 ${S.round} — 목표 ${targetForRound()}점. 다시 세팅하세요.`);
    }

    function renderAll() {
      renderStatus();
      renderRoster();
      renderTower();
    }

    $("btn-roll").onclick = doRoll;
    $("btn-shop").onclick = () => {
      $("shop-panel").classList.remove("hidden");
      if (!S.shopOffers.length) pickShop();
    };
    $("btn-next").onclick = nextRound;
    $("btn-reroll").onclick = () => {
      if (S.gold < SHOP_REROLL) return;
      S.gold -= SHOP_REROLL;
      pickShop();
      renderStatus();
    };

    initGame();
  </script>
</body>
</html>
